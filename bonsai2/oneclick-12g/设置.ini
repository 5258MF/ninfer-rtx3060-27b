; 自动KVMem忽略旧SINK/WINDOW分区字段；ANSWER=auto不固定32K，实际由引擎分配。
; ============================================================
;  ninfer 3060 一键包 设置文件（用记事本改，改完保存，重新运行 启动.bat 生效）
;  规则：一行一项，写成  名字=值 ；分号 ; 开头的行是说明，不起作用。
;  命令行可以临时覆盖任何一项，例如：启动.bat kvmem PORT=8085
;  双击 启动.bat 后按 C 一步步选，选好的值启动时会自动写回这个文件
; ============================================================

; ---------- 基本 ----------
; 启动模式：ask = 每次先显示当前配置（回车启动、C 一步步重新选、N/K/R/V 换模式）；
;   也可以固定写 normal / kvmem / rk8v4 / kvrk（不显示菜单，直接启动）
MODE=ask
; 模型：swift = Swift-Bonsai-2（推荐，思考更短更快）；base = Bonsai-2 原版
;   包里不带模型。第一次启动时（配置完按回车后）自动从魔搭社区下载到 model 文件夹，约 7.7 GiB，
;   支持断点续传，下完自动校验。也可以写一个 .ninfer 文件的路径（相对路径是相对这个文件夹），这时不会下载。
MODEL=swift
; 监听地址：127.0.0.1 = 只有本机能用；0.0.0.0 = 局域网也能用（这时请设置 API_KEY）
HOST=127.0.0.1
PORT=8084
; 客户端里填的模型名
MODEL_ID=qwen3.8-27b
; 访问密码，留空 = 不需要密码
API_KEY=
; MTP 投机解码的草稿长度：3 = 推荐（最快、最稳）；0 = 关闭（速度约减半）
MTP_DRAFT=3
; 看图功能：1 = 开，0 = 关（视觉权重放在内存里，关掉不再省显存）
VISION=1
VISION_MAX_TOKENS=4096
; （10-01 起视觉权重和词嵌入固定放内存，这一项不再起作用，留着只为兼容旧设置）
VISION_HOST=1
; 思考长度上限：0 = 不限（推荐，只受单次回答上限限制）；比如 8192 = 思考到 8192 就收尾、转去写正文
THINK_BUDGET=0
; 思考结束后（</think> 之后）是否自动将采样温度降到 0.2（提高工具调用和代码正文的稳定性）：1 = 开（推荐），0 = 关
POST_THINKING=1
; 引擎遇到内部状态不变量异常时是否自动清空缓存并恢复（避免服务进程直接退出）：1 = 开（推荐），0 = 关
RECOVER_INVARIANT=1
; 引擎意外退出后自动重启几次
RETRY=2
; 追加给引擎的其他参数（高级），例如 --greedy 或 --preserve-thinking
EXTRA=
; 1 = 只显示最终参数、不启动引擎（检查设置用）。一般在命令行临时用：启动.bat kvmem DRYRUN=1
DRYRUN=0

; ---------- 普通模式（normal）：全部放显存 ----------
; 上下文长度。12 GB 显卡最多 90112
NORMAL_CTX=90112
; 单次回答（含思考）最多多少 token
NORMAL_MAX_TOKENS=32768

; ---------- rk8v4 模式：全部放显存，KV 更省 ----------
; 12 GB 显卡最多 114688
RK8V4_CTX=114688
RK8V4_MAX_TOKENS=32768

; ---------- KVMem 模式（kvmem）：显存只放一部分，其余放内存 ----------
; 总上下文
KVMEM_CTX=262144
; 自动KVMem以RESIDENT确定总驻留预算；旧WINDOW/ANSWER字段不代表固定显存分区
KVMEM_WINDOW=0
; 自动KVMem以RESIDENT确定总驻留预算；旧WINDOW/ANSWER字段不代表固定显存分区
; 自动KVMem以RESIDENT确定总驻留预算；旧WINDOW/ANSWER字段不代表固定显存分区
KVMEM_ANSWER=auto
; 放在内存里的历史最多占多少 MiB
KVMEM_HOST_MIB=10240
; 窗口里固定保留对话最前面多少 token（系统提示词、工具说明一般在这里）
KVMEM_SINK=8192
; 历史被挤出显存后，这一轮的新输入（用户消息或工具结果）按新窗口重新算一遍，最多重算多少 token
; 越大越准、每轮越慢（重算 6144 个 token 约多 12 秒）。kvmem 和 kvrk 两个模式共用这一项
KVMEM_REPLAY_MAX=6144

; ---------- KVMem + rk8v4 模式（kvrk，实验性） ----------
KVRK_CTX=262144
KVRK_WINDOW=0
; 自动KVMem以RESIDENT确定总驻留预算；旧WINDOW/ANSWER字段不代表固定显存分区
KVRK_ANSWER=auto
KVRK_HOST_MIB=10240

CUDA_GRAPH=1

CPU_THREADS=auto

VISION_DEVICE=cpu

; recommended=当前推荐，auto=当前显存允许上限，也可填范围内的token数
KVMEM_RESIDENT=recommended

; recommended=当前推荐，auto=当前显存允许上限，也可填范围内的token数
KVRK_RESIDENT=recommended
