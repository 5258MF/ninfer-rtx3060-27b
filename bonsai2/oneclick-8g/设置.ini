; 自动KVMem忽略旧SINK/WINDOW分区字段；ANSWER=auto不固定32K，实际由引擎分配。
; ============================================================
;  ninfer 3060 8GB 一键包 设置文件（用记事本改，改完保存，重新运行 启动.bat 生效）
;  规则：一行一项，写成  名字=值 ；分号 ; 开头的行是说明，不起作用。
;  命令行可以临时覆盖任何一项，例如：启动.bat kvmem PORT=8085
;  双击 启动.bat 后按 C 一步步选，选好的值启动时会自动写回这个文件
;  所有上限都是实测的：模型自己最多用 7.5 GB 显存（7680 MiB），给桌面和其他程序留约 0.5 GB
; ============================================================

; ---------- 基本 ----------
; 启动模式：ask = 每次先显示当前配置（回车启动、C 一步步重新选、N/K/R/V 换模式）；
;   也可以固定写 normal / kvmem / rk4 / kvrk4（不显示菜单，直接启动）
MODE=ask
; 模型：swift = Swift-Bonsai-2 ptq1 + Q4 MTP（8G 专用，只有这一个）
;   包里不带模型。第一次启动时（配置完按回车后）自动从魔搭社区下载 ptq1 原始文件（约 6.6 GiB），
;   支持断点续传，下完自动校验，再用 patch 文件夹里的补丁转换成 8G 用的版本（约 6.4 GiB），转完删掉原始文件。
;   也可以写一个 .ninfer 文件的路径（相对路径是相对这个文件夹），这时不会下载。
MODEL=swift
; 监听地址：127.0.0.1 = 只有本机能用；0.0.0.0 = 局域网也能用（这时请设置 API_KEY）
HOST=127.0.0.1
PORT=8084
; 客户端里填的模型名
MODEL_ID=qwen3.8-27b
; 访问密码，留空 = 不需要密码
API_KEY=
; MTP 投机解码的草稿长度：3 = 推荐（最快、最稳）；0 = 关闭（速度约减半）
MTP_DRAFT=3
; 看图功能：1 = 开，0 = 关。8G 版的视觉权重固定放内存，开不开都不影响上限
VISION=1
VISION_MAX_TOKENS=4096
; 思考长度上限：0 = 不限（推荐，只受单次回答上限限制）；比如 8192 = 思考到 8192 就收尾、转去写正文
THINK_BUDGET=0
; 思考写完之后自动把温度降到这个值（思考过程本身不受影响）：正文和工具调用更稳，推荐 0.2
; 填 0 = 不用这个功能
POST_THINK_TEMP=0.2
; 引擎意外退出后自动重启几次
RETRY=2
; 追加给引擎的其他参数（高级），例如 --greedy 或 --preserve-thinking
EXTRA=
; 1 = 只显示最终参数、不启动引擎（检查设置用）。一般在命令行临时用：启动.bat kvmem DRYRUN=1
DRYRUN=0

; ---------- 普通模式（normal）：全部放显存，KV 用 rk8v4 ----------
; 上下文长度。8 GB 显卡最多 57344（56K）
NORMAL_CTX=57344
; 单次回答（含思考）最多多少 token。和输入共用上下文，不额外占显存
NORMAL_MAX_TOKENS=32768

; ---------- KVMem 模式（kvmem，推荐）：显存只放一部分，其余放内存，KV 用 rk8v4 ----------
; 总上下文
KVMEM_CTX=262144
; 显存档：std = 默认（WINDOW + ANSWER 最多 45056，模型最多用 7.5 GB）；
;   igpu = 显示器接核显时用（最多 49152，模型约用 7.6 GB，只给桌面留约 430 MB）
KVMEM_VRAM=std
; 显存里的“检索窗口”大小
KVMEM_WINDOW=0
; 显存里给“本轮新内容 + 回答”留的空间，同时也是单次回答上限
; 注意：WINDOW + ANSWER 最多 45056（KVMEM_VRAM=igpu 时 49152）
KVMEM_ANSWER=auto
; 放在内存里的历史最多占多少 MiB
KVMEM_HOST_MIB=10240
; 窗口里固定保留对话最前面多少 token（系统提示词、工具说明一般在这里）
KVMEM_SINK=2048
; 历史被挤出显存后，这一轮的新输入（用户消息或工具结果）按新窗口重新算一遍，最多重算多少 token
; 越大越准、每轮越慢。kvmem 和 kvrk4 两个模式共用这一项
KVMEM_REPLAY_MAX=6144

; ---------- 普通 rk4v4 模式（rk4，不推荐）：全部放显存，KV 压得更狠 ----------
; 比 rk8v4 慢 10–15%，质量差约 0.3%。8 GB 显卡最多 86016（84K）
RK4_CTX=86016
RK4_MAX_TOKENS=32768

; ---------- KVMem + rk4v4 模式（kvrk4，不推荐） ----------
KVRK4_CTX=131072
; 显存里 64K = 检索窗口 32K + 回答 32K（和 12G 版 KVMem+rk8v4 一样回答 32K）
KVRK4_WINDOW=0
; 注意：WINDOW + ANSWER 最多 65536
KVRK4_ANSWER=auto
KVRK4_HOST_MIB=10240

CUDA_GRAPH=0

VISION_DEVICE=cpu

CPU_THREADS=auto
